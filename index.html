<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101614"><meta name="description" content="失语者的世界：一场约15分钟的第一人称心理惊悚解谜。所有声音均有文字线索，静音也能完整游玩。">
  <title>失语者的世界 · 临江招待所</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23151e1b'/%3E%3Ctext x='12' y='47' fill='%23dfd6bb' font-size='44'%3E失%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=0.2.0">
</head>
<body>
<main id="app" data-ui>
  <canvas id="world" aria-label="招待所三维探索场景，使用WASD移动，拖动画面环顾，E调查"></canvas>
  <div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div id="veil" aria-hidden="true"></div>
  <section id="cover" class="cover">
    <div class="cover-top"><span class="hotel-brand">临江招待所</span><span>一段尚未结束的夜晚</span></div>
    <div class="cover-copy"><p class="edition">第一人称心理惊悚 · 可玩短篇</p><h1>失语者<br><span>的世界</span></h1><p class="cover-lead">她明早七点离开。你还是来找她了。<br>门外，却有人反复说：“她不需要你。”</p>
      <div class="cover-actions"><button id="start" class="primary" disabled>正在打开房门…</button><button id="continue" class="text-button" hidden>继续上次的夜晚 →</button></div>
      <p class="cover-note">约 15 分钟 · 自动保存 · 静音也能完整游玩 · v0.2.0 夜巡版</p>
    </div>
    <div class="door-caption"><span>407</span><p>请勿回应<br>无法确认来源的声音。</p></div>
    <div class="cover-bottom"><span>W A S D 移动　/　拖动环顾　/　E 调查</span><button id="cover-help" class="text-button">操作与体验设置 ↗</button></div>
  </section>
  <div id="hud" hidden>
    <header class="hud-top"><div><div class="hud-hotel">临江招待所</div><div id="location">407 客房</div></div><nav><button id="journal-btn" aria-label="打开证据笔记">证据 <span id="evidence-count">0</span><kbd>J</kbd></button><button id="sound-btn" aria-pressed="false">环境音：关</button><button id="pause-btn" aria-label="暂停游戏">暂停 <kbd>Esc</kbd></button></nav></header>
    <div id="objective" class="objective"></div><div id="crosshair" aria-hidden="true"></div>
    <div id="hotspot-labels" aria-label="附近可调查物件"></div>
    <div id="interaction" hidden><kbd>E</kbd><span></span></div>
    <div id="subtitle" role="status" aria-live="polite" hidden><span id="subtitle-source"></span><p id="subtitle-text"></p></div>
    <div id="toast" role="status" hidden></div><div id="threat" hidden><span></span><div><i></i></div></div>
    <footer class="hud-bottom"><span id="inventory">手电筒</span><span id="elapsed">00:00</span><span class="desktop-instructions">WASD 移动 · 拖动环顾 · E 调查 · J 笔记</span><button id="hint-btn">需要一点提示</button></footer>
    <div id="touch-controls"><div class="dpad"><button data-key="KeyW" aria-label="向前">↑</button><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button></div><button id="touch-use">调查</button></div>
  </div>
  <div id="chapter" hidden><span></span><p></p></div>
  <div id="modal-layer" hidden><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><span id="modal-tag"></span><button id="close-modal" aria-label="关闭面板">关闭 ×</button></div><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions"></div></section></div>
  <section id="ending" hidden></section>
  <div id="boot-error" hidden role="alert"><h2>房门暂时没有打开</h2><p>当前浏览器无法启动三维场景。请在 Chrome、Edge 或 Safari 中打开此页面，并启用硬件加速。</p><button onclick="location.reload()">重新尝试</button></div>
</main>
<script type="module" src="game.js?v=0.2.0"></script>
</body></html>
